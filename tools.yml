# The tools under test. {f} = the case file, {schema} = the official schema for the case's version,
# schema-check.mjs is copied into {node} by run.py so it resolves ajv there.
# {nb} = node_modules/.bin, {node} = the node tools dir, {ub} / {unode} = the separate usearazzo install, {py} = the python venv bin, {go} = the go bin dir, {suite} = this repo.
# claims: the Arazzo versions the tool says it supports (README, docs or its own version check); scores outside it are labelled.
# role: validates = says valid/invalid; loads = only parses what it will run (a pass means it loaded, not that it checked).
# A tool's verdict is its exit code: 0 = valid, non-zero = invalid, unless an `error` pattern says it crashed instead,
# or an `unsupported` pattern says it declined the document's Arazzo version (scored apart, never as a pass or a fail).
tools:
  - id: oai-schema
    name: Official OAI JSON Schema (ajv)
    repo: https://github.com/OAI/Arazzo-Specification
    role: reference
    version_cmd: "cat {suite}/cases/oai/SOURCE"
    cmd: "node {node}/schema-check.mjs {schema} {f}"
  - id: spectral
    claims: [1.0.0, 1.0.1]
    name: Spectral (spectral:arazzo)
    repo: https://github.com/stoplightio/spectral
    role: validates
    version_cmd: "{nb}/spectral --version"
    cmd: "{nb}/spectral lint -r {suite}/rulesets/spectral-arazzo.yaml -F error {f}"
    unsupported: 'unrecognized-format'
  - id: redocly
    claims: [1.0.0, 1.0.1, 1.1.0]
    name: Redocly CLI lint
    repo: https://github.com/Redocly/redocly-cli
    role: validates
    version_cmd: "{nb}/redocly --version"
    cmd: "{nb}/redocly lint --format=stylish {f}"
  - id: jentic-validator
    claims: [1.0.0, 1.0.1]
    name: Jentic Arazzo Validator
    repo: https://github.com/jentic/jentic-arazzo-tools
    role: validates
    version_cmd: "node -p \"require('{node}/node_modules/@jentic/arazzo-validator/package.json').version\""
    cmd: "{nb}/arazzo-validator {f}"
    notes: "Measured with @speclynx/apidom-ls pinned to 2.11.7. A plain npm install of alpha.33 resolves apidom-ls ^2.11.6 to 2.13.0, and then every schema and semantic check is silent: it only rejects documents it does not recognize as Arazzo (Node 20, 22 and 24 alike)."
  - id: speakeasy-openapi
    claims: [1.0.0, 1.0.1]
    name: Speakeasy openapi CLI (arazzo validate)
    repo: https://github.com/speakeasy-api/openapi
    role: validates
    version_cmd: "{go}/openapi --version"
    cmd: "{go}/openapi arazzo validate {f}"
    unsupported: 'validation-supported-version'
  - id: arazzo-runner
    name: Arazzo Runner (list-workflows)
    repo: https://github.com/jentic/arazzo-engine
    role: loads
    version_cmd: "{py}/pip show arazzo-runner | grep Version"
    cmd: "{py}/arazzo-runner list-workflows {f}"
    error: 'Traceback'

  - id: usearazzo
    claims: [1.0.0, 1.0.1, 1.1.0]
    name: UseArazzo validator
    repo: https://github.com/usearazzo/arazzo-toolkit
    role: validates
    version_cmd: "{ub}/usearazzo --version"
    cmd: "{ub}/usearazzo validate --json-schema-validation {f}"
    notes: "Run with --json-schema-validation, which is off by default. Installed on its own: it needs a newer @speclynx/apidom-ls than the 2.11.7 the Jentic validator is pinned to, and under that pin it reports no problems at all."
  - id: libopenapi
    claims: [1.0.0, 1.0.1]
    name: libopenapi arazzo.Validate
    repo: https://github.com/pb33f/libopenapi
    role: validates
    version_cmd: "go version -m {go}/libopenapi-arazzo | grep pb33f/libopenapi"
    cmd: "{go}/libopenapi-arazzo validate {f}"
    unsupported: 'unsupported arazzo version'
    notes: "A Go library with no CLI; scripts/libopenapi-arazzo wraps arazzo.Validate. Its own version check accepts 1.0.x only."

# The execution tier (scripts/run-exec.py): whole workflows run against scripts/mock-petstore.py on 127.0.0.1:4010.
# {workflow} = the workflow to run, {inputs} = the inputs as JSON, {inputs_kv} = the inputs as `-i key=value` flags.
# A run succeeded when `success` matches the output; with no `success` pattern, when the exit code is 0.
runners:
  - id: redocly-respect
    name: Redocly Respect
    repo: https://github.com/Redocly/redocly-cli
    version_cmd: "{nb}/redocly --version"
    cmd: "{nb}/redocly respect {f} -w {workflow} {inputs_kv}"
  - id: arazzo-runner
    name: Arazzo Runner
    repo: https://github.com/jentic/arazzo-engine
    version_cmd: "{py}/pip show arazzo-runner | grep Version"
    cmd: "{py}/arazzo-runner execute-workflow {f} --workflow-id {workflow} --inputs '{inputs}'"
    success: 'WorkflowExecutionResult\(status=workflow_complete'
  - id: usearazzo-runner
    name: UseArazzo runner
    repo: https://github.com/usearazzo/arazzo-toolkit
    version_cmd: "node -p \"require('{unode}/node_modules/@usearazzo/runner/package.json').version\""
    cmd: "node {unode}/usearazzo-run.mjs {f} {workflow} '{inputs}'"
    notes: "A library with no CLI; scripts/usearazzo-run.mjs calls ArazzoRunner.load and execute."
  - id: libopenapi
    name: libopenapi arazzo engine
    repo: https://github.com/pb33f/libopenapi
    version_cmd: "go version -m {go}/libopenapi-arazzo | grep pb33f/libopenapi"
    cmd: "{go}/libopenapi-arazzo run {f} {workflow} '{inputs}'"
    notes: "The library leaves HTTP to the caller, so scripts/libopenapi-arazzo carries a minimal executor. ExecutionRequest passes parameters by name only, without their `in`, so that executor places each one where the source OpenAPI operation declares it; a parameter the operation does not declare cannot be placed."
