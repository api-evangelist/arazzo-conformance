arazzo: 1.1.0
info:
  title: 'valid-success-action-parameters: a goto to a workflow may pass parameters (without in)'
  version: 1.0.0
sourceDescriptions:
- name: petstore
  url: ../sources/petstore.openapi.yaml
  type: openapi
workflows:
- workflowId: adoptPet
  inputs:
    type: object
    properties:
      name:
        type: string
  steps:
  - stepId: create
    operationId: createPet
    requestBody:
      contentType: application/json
      payload:
        name: $inputs.name
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      petId: $response.body#/id
  - stepId: fetch
    operationId: getPet
    parameters:
    - name: petId
      in: path
      value: $steps.create.outputs.petId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
    onSuccess:
    - name: tell
      type: goto
      workflowId: notify
      parameters:
      - name: petId
        value: $steps.create.outputs.petId
  outputs:
    petId: $steps.create.outputs.petId
- workflowId: notify
  inputs:
    type: object
    properties:
      petId:
        type: string
  steps:
  - stepId: list
    operationId: listPets
