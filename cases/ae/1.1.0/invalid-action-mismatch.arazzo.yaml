arazzo: 1.1.0
info:
  title: 'invalid-action-mismatch: action MUST match the AsyncAPI operation (placeOrder is a send operation)'
  version: 1.0.0
sourceDescriptions:
- name: petstore
  url: ../sources/petstore.openapi.yaml
  type: openapi
- name: orders
  url: ../sources/orders.asyncapi.yaml
  type: asyncapi
workflows:
- workflowId: adoptPet
  inputs:
    type: object
    properties:
      name:
        type: string
  steps:
  - stepId: create
    operationId: $sourceDescriptions.petstore.createPet
    requestBody:
      contentType: application/json
      payload:
        name: $inputs.name
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      petId: $response.body#/id
  - stepId: fetch
    operationId: $sourceDescriptions.petstore.getPet
    parameters:
    - name: petId
      in: path
      value: $steps.create.outputs.petId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
  - stepId: placeOrder
    operationId: $sourceDescriptions.orders.placeOrder
    action: receive
    requestBody:
      payload:
        petId: $steps.create.outputs.petId
  - stepId: awaitStatus
    operationId: $sourceDescriptions.orders.onOrderStatus
    action: receive
    correlationId: $steps.create.outputs.petId
    timeout: 30000
    outputs:
      orderStatus: $message.payload#/status
  outputs:
    petId: $steps.create.outputs.petId
