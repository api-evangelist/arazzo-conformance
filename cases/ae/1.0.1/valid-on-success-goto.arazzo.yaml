arazzo: 1.0.1
info:
  title: 'valid-on-success-goto: onSuccess goto a later stepId'
  version: 1.0.0
sourceDescriptions:
- name: petstore
  url: ../sources/petstore.openapi.yaml
  type: openapi
workflows:
- workflowId: adoptPet
  inputs:
    type: object
    properties:
      name:
        type: string
  steps:
  - stepId: create
    operationId: createPet
    requestBody:
      contentType: application/json
      payload:
        name: $inputs.name
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      petId: $response.body#/id
    onSuccess:
    - name: skipAhead
      type: goto
      stepId: fetch
  - stepId: fetch
    operationId: getPet
    parameters:
    - name: petId
      in: path
      value: $steps.create.outputs.petId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
  outputs:
    petId: $steps.create.outputs.petId
