arazzo: 1.0.1
info:
  title: 'on-failure-goto-recover: onFailure goto runs the recovery step'
  version: 1.0.0
sourceDescriptions:
- name: petstore
  url: ../../ae/sources/petstore.openapi.yaml
  type: openapi
workflows:
- workflowId: run
  steps:
  - stepId: fetch
    operationId: getPet
    parameters:
    - name: petId
      in: path
      value: missing
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
    onFailure:
    - name: recover
      type: goto
      stepId: list
  - stepId: list
    operationId: listPets
    successCriteria:
    - condition: $statusCode == 200
