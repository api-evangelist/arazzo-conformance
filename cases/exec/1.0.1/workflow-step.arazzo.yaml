arazzo: 1.0.1
info:
  title: 'workflow-step: a step can run another workflow and use its outputs'
  version: 1.0.0
sourceDescriptions:
- name: petstore
  url: ../../ae/sources/petstore.openapi.yaml
  type: openapi
workflows:
- workflowId: adopt
  inputs:
    type: object
    properties:
      name:
        type: string
    required:
    - name
  steps:
  - stepId: create
    operationId: createPet
    requestBody:
      contentType: application/json
      payload:
        name: $inputs.name
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      petId: $response.body#/id
  - stepId: fetch
    operationId: getPet
    parameters:
    - name: petId
      in: path
      value: $steps.create.outputs.petId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
  outputs:
    petId: $steps.create.outputs.petId
- workflowId: run
  steps:
  - stepId: sub
    workflowId: adopt
    parameters:
    - name: name
      value: Rex
    outputs:
      petId: $outputs.petId
  - stepId: again
    operationId: getPet
    parameters:
    - name: petId
      in: path
      value: $steps.sub.outputs.petId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
