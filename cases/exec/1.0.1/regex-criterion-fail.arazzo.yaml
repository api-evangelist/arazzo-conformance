arazzo: 1.0.1
info:
  title: 'regex-criterion-fail: a regex criterion that does not match fails the workflow'
  version: 1.0.0
sourceDescriptions:
- name: petstore
  url: ../../ae/sources/petstore.openapi.yaml
  type: openapi
workflows:
- workflowId: run
  inputs:
    type: object
    properties:
      name:
        type: string
    required:
    - name
  steps:
  - stepId: create
    operationId: createPet
    requestBody:
      contentType: application/json
      payload:
        name: $inputs.name
    successCriteria:
    - condition: $statusCode == 201
    - context: $response.body#/name
      condition: ^Max$
      type: regex
    outputs:
      petId: $response.body#/id
