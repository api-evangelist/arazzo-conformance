arazzo: 1.0.1
info:
  title: 'jsonpath-filter-over-array: a jsonpath filter over an array body, read the way RFC 9535 reads'
  version: 1.0.0
sourceDescriptions:
- name: petstore
  url: ../../ae/sources/petstore.openapi.yaml
  type: openapi
workflows:
- workflowId: run
  inputs:
    type: object
    properties:
      name:
        type: string
    required:
    - name
  steps:
  - stepId: create
    operationId: createPet
    requestBody:
      contentType: application/json
      payload:
        name: $inputs.name
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      petId: $response.body#/id
  - stepId: list
    operationId: listPets
    successCriteria:
    - condition: $statusCode == 200
    - context: $response.body
      condition: $[?(@.name == 'Rex')]
      type: jsonpath
