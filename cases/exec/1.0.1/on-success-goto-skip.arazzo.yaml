arazzo: 1.0.1
info:
  title: 'on-success-goto-skip: onSuccess goto jumps over the steps between'
  version: 1.0.0
sourceDescriptions:
- name: petstore
  url: ../../ae/sources/petstore.openapi.yaml
  type: openapi
workflows:
- workflowId: run
  inputs:
    type: object
    properties:
      name:
        type: string
    required:
    - name
  steps:
  - stepId: create
    operationId: createPet
    requestBody:
      contentType: application/json
      payload:
        name: $inputs.name
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      petId: $response.body#/id
    onSuccess:
    - name: jump
      type: goto
      stepId: fetch
  - stepId: list
    operationId: listPets
    successCriteria:
    - condition: $statusCode == 200
  - stepId: fetch
    operationId: getPet
    parameters:
    - name: petId
      in: path
      value: $steps.create.outputs.petId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $response.body#/status
